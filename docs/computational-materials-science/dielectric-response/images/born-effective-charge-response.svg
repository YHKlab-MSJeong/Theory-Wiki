<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">Born 유효전하의 변위와 분극 응답</title><desc id="desc">평형 상태에서 원자 하나를 미소 변위시키면 전자 재배치를 포함한 분극 변화가 생기며 그 기울기로 Born 유효전하를 정의한다.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#42556c"/></marker></defs>
<rect width="960" height="380" fill="#f7f7f5"/>
<g font-family="system-ui, sans-serif" fill="#253142"><rect x="35" y="105" width="240" height="135" rx="8" fill="#fff" stroke="#253142" stroke-width="1.5"/><text x="155.0" y="164.0" text-anchor="middle" font-size="18">절연 결정의 평형 상태</text><text x="155.0" y="193.0" text-anchor="middle" font-size="18">원자 κ, 분극 P</text><rect x="355" y="105" width="240" height="135" rx="8" fill="#e9f1f4" stroke="#253142" stroke-width="1.5"/><text x="475.0" y="164.0" text-anchor="middle" font-size="18">원자 κ의 작은 변위</text><text x="475.0" y="193.0" text-anchor="middle" font-size="18">uκβ → uκβ + δuκβ</text><rect x="675" y="105" width="250" height="135" rx="8" fill="#f8ede8" stroke="#253142" stroke-width="1.5"/><text x="800.0" y="164.0" text-anchor="middle" font-size="18">전자 재배치와 이온 변위</text><text x="800.0" y="193.0" text-anchor="middle" font-size="18">분극 변화 δPα</text><path d="M275 173 L355 173" fill="none" stroke="#42556c" stroke-width="2" marker-end="url(#arr)"/><path d="M595 173 L675 173" fill="none" stroke="#42556c" stroke-width="2" marker-end="url(#arr)"/><text x="480" y="295" text-anchor="middle" font-size="22">Z*κ,αβ = Ω ∂Pα / ∂uκβ = ∂Fκβ / ∂Eα</text><text x="480" y="335" text-anchor="middle" font-size="16">선형 응답 · 다른 원자 좌표 고정 · 거시 분극의 변화율</text></g></svg>
