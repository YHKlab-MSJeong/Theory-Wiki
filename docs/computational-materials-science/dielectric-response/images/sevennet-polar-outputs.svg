<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">SevenNet-Polar의 모델 출력</title><desc id="desc">원자 구조를 입력으로 Born 유효전하를 예측하며 다중과제 모델은 에너지 힘 응력도 출력한다. 유전율 계산에는 별도 포논과 전자 응답이 필요하다.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#42556c"/></marker></defs>
<rect width="960" height="380" fill="#f7f7f5"/>
<g font-family="system-ui, sans-serif" fill="#253142"><rect x="35" y="110" width="190" height="100" rx="8" fill="#fff" stroke="#253142" stroke-width="1.5"/><text x="130.0" y="151.5" text-anchor="middle" font-size="18">원자 종류</text><text x="130.0" y="180.5" text-anchor="middle" font-size="18">원자 구조</text><rect x="300" y="110" width="210" height="100" rx="8" fill="#e9f1f4" stroke="#253142" stroke-width="1.5"/><text x="405.0" y="151.5" text-anchor="middle" font-size="18">SevenNet-Polar</text><text x="405.0" y="180.5" text-anchor="middle" font-size="18">등변 그래프 신경망</text><rect x="585" y="45" width="335" height="95" rx="8" fill="#f8ede8" stroke="#253142" stroke-width="1.5"/><text x="752.5" y="84.0" text-anchor="middle" font-size="18">Born 유효전하 텐서</text><text x="752.5" y="113.0" text-anchor="middle" font-size="18">BEC 전용 또는 다중과제 출력</text><rect x="585" y="235" width="335" height="95" rx="8" fill="#fff" stroke="#253142" stroke-width="1.5"/><text x="752.5" y="274.0" text-anchor="middle" font-size="18">에너지 · 힘 · 응력</text><text x="752.5" y="303.0" text-anchor="middle" font-size="18">다중과제 출력</text><path d="M225 160 L300 160" fill="none" stroke="#42556c" stroke-width="2" marker-end="url(#arr)"/><path d="M510 135 L585 92" fill="none" stroke="#42556c" stroke-width="2" marker-end="url(#arr)"/><path d="M510 185 L585 282" fill="none" stroke="#42556c" stroke-width="2" marker-end="url(#arr)"/><text x="480" y="365" text-anchor="middle" font-size="16">유전율 계산: 포논 정보와 전자 응답 별도 필요</text></g></svg>
