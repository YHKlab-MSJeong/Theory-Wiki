<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">DFPT 유전 응답의 계산 흐름</title><desc id="desc">바닥상태에서 전기장과 원자 변위 응답을 계산하고 Born 전하와 포논으로 이온 응답을 구성해 전자 응답과 합한다.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#42556c"/></marker></defs>
<rect width="960" height="380" fill="#f7f7f5"/>
