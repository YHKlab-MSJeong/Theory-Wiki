<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 550" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="surface-roughness-scattering-title surface-roughness-scattering-desc" id="surface-roughness-scattering-root">
<title id="surface-roughness-scattering-title">Surface roughness statistics to scattering rate</title>
<desc id="surface-roughness-scattering-desc">Interface height statistics define a correlation function and spectrum; a model for the potential perturbation and electronic states then gives elastic transition rates.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #surface-roughness-scattering-root { font-family: system-ui, sans-serif; }
      #surface-roughness-scattering-root .diagram-container { width:100%;overflow-x:auto }</style>
 <marker id="surface-roughness-scattering-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#4f5d75"/></marker>
 <marker id="surface-roughness-scattering-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#bf4520"/></marker>
</defs>
<rect width="1100" height="550" fill="#f5f5f5"/>
<text x="44" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1.4" fill="#4f5d75">ROUGHNESS SCATTERING MODEL</text>
<rect x="36" y="145" width="236" height="120" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="154.0" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >interface height</text><text x="154.0" y="199" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >Δ(r), RMS height</text><text x="154.0" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >correlation length Λ</text><path d="M272 205 H310" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#surface-roughness-scattering-arrow)"/><rect x="310" y="145" width="236" height="120" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.4"/><text x="428.0" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >roughness statistics</text><text x="428.0" y="199" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >C(r)  →  S(q)</text><path d="M546 205 H584" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#surface-roughness-scattering-arrow-accent)"/><rect x="584" y="145" width="236" height="120" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="702.0" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >potential perturbation</text><text x="702.0" y="199" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >δU and 〈k′|δU|k〉</text><path d="M820 205 H858" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#surface-roughness-scattering-arrow)"/><rect x="858" y="145" width="206" height="120" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="961.0" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >elastic transition</text><text x="961.0" y="199" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >Wk→k′</text><text x="961.0" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >Born / Fermi golden rule</text><text x="550" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#4f5d75" >거칠기 통계에서 rate로 가는 데에는 wavefunction·screening model이 더 필요하다.</text><rect x="178" y="376" width="744" height="82" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity=".02"/><text x="550.0" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >모형 입력과 한계</text><text x="550.0" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >Δrms와 Λ만으로 보편적인 mobility 또는 scattering rate가 정해지지는 않는다.</text><text x="550" y="512" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#4f5d75" >C(r)와 S(q)의 함수형 및 Λ 정의를 함께 기록한다.</text>
</svg>
