<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="landauer-current-window-title landauer-current-window-desc" id="landauer-current-window-root">
<title id="landauer-current-window-title">Landauer current from transmission and occupations</title>
<desc id="landauer-current-window-desc">Reservoir occupation difference weights the energy-resolved transmission; integration gives finite-bias current, whose linear-response and zero-temperature limits give conductance.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #landauer-current-window-root { font-family: system-ui, sans-serif; }
      #landauer-current-window-root .diagram-container { width:100%;overflow-x:auto }</style>
 <marker id="landauer-current-window-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#4f5d75"/></marker>
 <marker id="landauer-current-window-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#bf4520"/></marker>
</defs>
<rect width="1100" height="560" fill="#f5f5f5"/>
<text x="44" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1.4" fill="#4f5d75">THEORY FLOW</text>
<rect x="40" y="105" width="226" height="112" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="153.0" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >reservoir occupations</text><text x="153.0" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >μL, μR, Θ</text><text x="153.0" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >fL(E) − fR(E)</text><path d="M266 161 H302" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#landauer-current-window-arrow)"/><rect x="302" y="105" width="226" height="112" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.4"/><text x="415.0" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >device transmission</text><text x="415.0" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >Tσ(E,V)</text><text x="415.0" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >channel and spin convention</text><path d="M528 161 H564" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#landauer-current-window-arrow-accent)"/><rect x="564" y="105" width="226" height="112" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="677.0" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >energy-resolved term</text><text x="677.0" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >Tσ(E,V) × [fL − fR]</text><path d="M790 161 H826" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#landauer-current-window-arrow)"/><rect x="826" y="105" width="234" height="112" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="943.0" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >finite-bias current</text><text x="943.0" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >I(V) = (e/h) ∑σ ∫ dE ···</text><text x="550" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4f5d75" >전류식에서 선형 응답으로</text><rect x="80" y="328" width="260" height="100" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity=".02"/><text x="210.0" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >작은 바이어스</text><text x="210.0" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >V → 0</text><path d="M340 378 H402" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#landauer-current-window-arrow)"/><rect x="402" y="328" width="286" height="100" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.4"/><text x="545.0" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >열적 가중</text><text x="545.0" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >Tσ(E,0) (−∂f/∂E)</text><path d="M688 378 H750" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#landauer-current-window-arrow-accent)"/><rect x="750" y="328" width="300" height="100" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="900.0" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >영도 한계</text><text x="900.0" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >G = (e²/h) ∑σ Tσ(μ,0)</text><text x="550" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#4f5d75" >개념도: 유한 온도에서는 μ 주변 에너지 범위가 가중된다.</text>
</svg>
