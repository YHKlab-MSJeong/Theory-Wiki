<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="defect-scattering-model-title defect-scattering-model-desc" id="defect-scattering-model-root">
<title id="defect-scattering-model-title">Defect ensemble and disorder-scattering path</title>
<desc id="defect-scattering-model-desc">Defect species, charge and spatial statistics determine a disorder potential; disorder-averaged squared matrix elements, density and final states enter weak-disorder Born rates. A periodic supercell is distinct from a random ensemble.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #defect-scattering-model-root { font-family: system-ui, sans-serif; }
      #defect-scattering-model-root .diagram-container { width:100%;overflow-x:auto }</style>
 <marker id="defect-scattering-model-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#4f5d75"/></marker>
 <marker id="defect-scattering-model-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#bf4520"/></marker>
</defs>
<rect width="1100" height="540" fill="#f5f5f5"/>
<text x="44" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1.4" fill="#4f5d75">DISORDER MODEL SELECTION</text>
<rect x="38" y="130" width="236" height="122" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="156.0" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >defect ensemble</text><text x="156.0" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >species · charge · position</text><text x="156.0" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >density and correlation</text><path d="M274 191 H312" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#defect-scattering-model-arrow)"/><rect x="312" y="130" width="236" height="122" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.4"/><text x="430.0" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >disorder potential</text><text x="430.0" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >Vj; dielectric</text><text x="430.0" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >carrier density · screening</text><path d="M548 191 H586" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#defect-scattering-model-arrow-accent)"/><rect x="586" y="130" width="224" height="122" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="698" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#2d3142">single-defect matrix element</text><text x="698" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4f5d75">Mₖ′ₖ = ⟨k′|Vⱼ|k⟩</text><text x="698" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4f5d75">disorder average |M|²</text><text x="698" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4f5d75">single-defect normalization</text><path d="M810 191 H848" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#defect-scattering-model-arrow)"/><rect x="848" y="130" width="216" height="142" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="956" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142">transport rate</text><text x="956" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4f5d75">independent-defect Born</text><text x="956" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4f5d75">defect density</text><text x="956" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4f5d75">factor follows normalization</text><text x="956" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4f5d75">final-state sum</text><text x="550" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#4f5d75" >수송 예측에는 defect ensemble과 carrier distribution이 필요하다.</text><rect x="86" y="358" width="422" height="88" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity=".02"/><text x="297.0" y="387" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >periodic DFT supercell</text><text x="297.0" y="412" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >ordered defect array의 전자 구조</text><rect x="592" y="358" width="422" height="88" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity=".02"/><text x="803.0" y="387" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >random dilute ensemble</text><text x="803.0" y="412" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75">density · spatial correlation · rate</text><text x="550" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#4f5d75" >한 vacancy supercell을 무작위 결함 ensemble의 mobility로 바로 해석하지 않는다.</text>
</svg>
