      #open-transport-overview-root .diagram-container { width:100%;overflow-x:auto }</style><marker id="open-transport-overview-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#4f5d75"/></marker><marker id="open-transport-overview-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#bf4520"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><rect x="40" y="64" width="880" height="196" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity=".02" stroke-opacity=".18"/><text x="60" y="88" font-size="11" fill="#4f5d75" letter-spacing=".14em">OPEN SYSTEM</text><path d="M210 170H292" stroke="#4f5d75" fill="none" marker-end="url(#open-transport-overview-a)"/><path d="M444 170H526" stroke="#bf4520" stroke-width="1.4" fill="none" marker-end="url(#open-transport-overview-b)"/><path d="M678 170H760" stroke="#4f5d75" fill="none" marker-end="url(#open-transport-overview-a)"/><rect x="64" y="124" width="146" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="137" y="158" text-anchor="middle" font-size="16" font-weight="600">Reservoir</text><text x="137" y="182" text-anchor="middle" font-size="11" fill="#4f5d75">μ, T · f(E)</text><rect x="292" y="124" width="152" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="368" y="158" text-anchor="middle" font-size="16" font-weight="600">Lead / Σᵣ</text><text x="368" y="182" text-anchor="middle" font-size="11" fill="#4f5d75">boundary · Γ</text><rect x="526" y="124" width="152" height="92" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity=".08"/><text x="602" y="158" text-anchor="middle" font-size="16" font-weight="600">Central region</text><text x="602" y="182" text-anchor="middle" font-size="11" fill="#4f5d75">scattering · T(E)</text><rect x="760" y="124" width="136" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="828" y="158" text-anchor="middle" font-size="16" font-weight="600">Current</text><text x="828" y="182" text-anchor="middle" font-size="11" fill="#4f5d75">I, Jᴱ, JQ</text><path d="M602 216V334" stroke="#bf4520" stroke-width="1.4" fill="none" marker-end="url(#open-transport-overview-b)"/><rect x="112" y="334" width="210" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="217" y="368" text-anchor="middle" font-size="15" font-weight="600">NEGF</text><text x="217" y="391" text-anchor="middle" font-size="11" fill="#4f5d75">Gᵣ, G&lt;, Σ</text><rect x="375" y="334" width="210" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="480" y="368" text-anchor="middle" font-size="15" font-weight="600">QTBM</text><text x="480" y="391" text-anchor="middle" font-size="11" fill="#4f5d75">scattering states</text><rect x="638" y="334" width="210" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="743" y="368" text-anchor="middle" font-size="15" font-weight="600">Landauer</text><text x="743" y="391" text-anchor="middle" font-size="11" fill="#4f5d75">T(E) → current</text><line x1="48" y1="472" x2="912" y2="472" stroke="#2d3142" stroke-opacity=".18"/><text x="56" y="496" font-size="12" fill="#4f5d75">self-energy는 열린 경계, reservoir는 주입 점유를 정한다. 같은 현재를 계산해도 closure와 가정은 별도로 검증한다.</text></svg>
