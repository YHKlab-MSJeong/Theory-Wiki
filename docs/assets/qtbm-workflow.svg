<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="qtbm-workflow-title qtbm-workflow-desc" id="qtbm-workflow-root">
  <title id="qtbm-workflow-title">QTBM elastic scattering workflow with a separate scattering-model extension</title>
  <desc id="qtbm-workflow-desc">The baseline QTBM selects an incident lead mode and energy, solves a stationary open-boundary problem with an incident source, extracts outgoing amplitudes and flux transmission, and sums occupation-weighted signed mode currents. A separate model-dependent extension can add transition rates, bath occupations and population updates, for example with a Pauli master equation.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #qtbm-workflow-root { font-family: system-ui, sans-serif; }
      #qtbm-workflow-root .diagram-container { width: 100%; overflow-x: auto; }</style>
    <marker id="qtbm-workflow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#4f5d75"/></marker>
    <marker id="qtbm-workflow-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#bf4520"/></marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <rect x="24" y="104" width="912" height="196" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity=".02" stroke-opacity=".18"/>
  <rect x="40" y="108" width="120" height="18" rx="2" fill="#f5f5f5"/>
  <text x="48" y="122" font-size="8" font-weight="600" letter-spacing="1.2" fill="#4f5d75">ELASTIC QTBM</text>
  <rect x="84" y="360" width="792" height="164" rx="8" fill="#2d3142" stroke="#2d3142" stroke-dasharray="5,4" fill-opacity=".02" stroke-opacity=".28"/>
  <rect x="104" y="364" width="336" height="18" rx="2" fill="#f5f5f5"/>
  <text x="112" y="378" font-size="8" font-weight="600" letter-spacing="1.2" fill="#4f5d75">MODEL-DEPENDENT SCATTERING EXTENSION</text>

  <path d="M192 212H216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qtbm-workflow-arrow)"/>
  <path d="M376 212H400" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#qtbm-workflow-arrow-accent)"/>
  <path d="M560 212H584" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qtbm-workflow-arrow)"/>
  <path d="M744 212H756" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qtbm-workflow-arrow)"/>
  <path d="M480 264V336H72V440H120" fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#qtbm-workflow-arrow)"/>
  <rect x="318" y="306" width="76" height="20" rx="3" fill="#f5f5f5"/>
  <text x="356" y="320" text-anchor="middle" font-size="12" fill="#4f5d75">optional</text>
  <path d="M320 440H380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qtbm-workflow-arrow)"/>
  <path d="M580 440H640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qtbm-workflow-arrow)"/>

  <rect x="32" y="160" width="160" height="104" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="112" y="202" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Lead modes</text>
  <text x="112" y="230" text-anchor="middle" font-size="12" fill="#4f5d75">E, propagating channels</text>

  <rect x="216" y="160" width="160" height="104" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="296" y="202" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Incident channel</text>
  <text x="296" y="230" text-anchor="middle" font-size="12" fill="#4f5d75">choose α, n</text>

  <rect x="400" y="160" width="160" height="104" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity=".08"/>
  <text x="480" y="202" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Open-boundary solve</text>
  <text x="480" y="230" text-anchor="middle" font-size="11" fill="#4f5d75">open boundary + source sαn</text>

  <rect x="584" y="160" width="160" height="104" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="664" y="202" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Outgoing modes</text>
  <text x="664" y="230" text-anchor="middle" font-size="12" fill="#4f5d75">r, t → T = Jout / Jin</text>

  <rect x="756" y="160" width="184" height="104" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="848" y="202" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Net current</text>
  <text x="848" y="222" text-anchor="middle" font-size="10" fill="#4f5d75">∫dE Σα,n fα(E) Iαn(E)</text>
  <text x="848" y="246" text-anchor="middle" font-size="10" fill="#4f5d75">signed mode contributions</text>

  <rect x="120" y="396" width="200" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="220" y="434" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Add collision model</text>
  <text x="220" y="456" text-anchor="middle" font-size="11" fill="#4f5d75">transition rates · bath f</text>
  <text x="220" y="474" text-anchor="middle" font-size="10" fill="#4f5d75">e.g. Pauli master equation</text>

  <rect x="380" y="396" width="200" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="480" y="434" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Update populations</text>
  <text x="480" y="460" text-anchor="middle" font-size="12" fill="#4f5d75">in / out transitions</text>

  <rect x="640" y="396" width="200" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="740" y="434" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Check the closure</text>
  <text x="740" y="460" text-anchor="middle" font-size="12" fill="#4f5d75">current + model limits</text>

  <line x1="48" y1="540" x2="912" y2="540" stroke="#2d3142" stroke-opacity=".18"/>
  <text x="56" y="564" font-size="12" fill="#4f5d75">−iW alone can absorb particles; it does not specify the matching in-scattering or reinjection.</text>
</svg>
