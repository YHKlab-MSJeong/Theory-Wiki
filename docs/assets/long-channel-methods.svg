<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="diagram-title diagram-desc" id="long-channel-methods-root">
  <title id="diagram-title">짧은 DFT 정보에서 긴 채널을 다루는 세 가지 계산 경로</title>
  <desc id="diagram-desc">Hamiltonian 블록 반복은 짧은 DFT의 행렬을 조립해 NEGF 또는 RGF로 수송을 계산한다. Order-N DFT는 큰 구조 전체의 전자구조를 푼다. ML Hamiltonian은 작은 DFT 자료로 학습한 모델이 긴 구조의 행렬을 예측하고 NEGF 또는 RGF에 연결한다.</desc>
  <defs>
      <style>#long-channel-methods-root text { font-family: "Noto Sans CJK KR", Arial, sans-serif; fill: #2d3142; }
      #long-channel-methods-root .title { font-size: 27px; font-weight: 700; }
      #long-channel-methods-root .subtitle { font-size: 15px; fill: #4f5d75; }
      #long-channel-methods-root .head { font-size: 14px; font-weight: 700; fill: #4f5d75; letter-spacing: .02em; }
      #long-channel-methods-root .lane-title { font-size: 18px; font-weight: 700; }
      #long-channel-methods-root .lane-sub { font-size: 13px; fill: #4f5d75; }
      #long-channel-methods-root .box-title { font-size: 16px; font-weight: 700; }
      #long-channel-methods-root .box-copy { font-size: 13px; fill: #4f5d75; }
      #long-channel-methods-root .foot { font-size: 13px; fill: #4f5d75; }
      #long-channel-methods-root .arrow { fill: none; stroke: #4f5d75; stroke-width: 2; marker-end: url(#long-channel-methods-arrow); }</style>
    <marker id="long-channel-methods-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK KR", Arial, sans-serif; fill: #2d3142; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4f5d75; }
      .head { font-size: 14px; font-weight: 700; fill: #4f5d75; letter-spacing: .02em; }
      .lane-title { font-size: 18px; font-weight: 700; }
      .lane-sub { font-size: 13px; fill: #4f5d75; }
      .box-title { font-size: 16px; font-weight: 700; }
      .box-copy { font-size: 13px; fill: #4f5d75; }
      .foot { font-size: 13px; fill: #4f5d75; }
      .arrow { fill: none; stroke: #4f5d75; stroke-width: 2; marker-end: url(#long-channel-methods-arrow); }
    </style>
  </defs>
  <rect width="1400" height="650" fill="#ffffff"/>
  <text x="44" y="48" class="title">긴 채널로 가는 세 가지 계산 경로</text>
  <text x="44" y="76" class="subtitle">무엇을 확장하는지에 따라 필요한 입력과 계산, 적용 범위가 달라진다.</text>

  <text x="420" y="126" class="head" text-anchor="middle">입력 정보</text>
  <text x="700" y="126" class="head" text-anchor="middle">긴 구조의 구성</text>
  <text x="980" y="126" class="head" text-anchor="middle">주요 계산</text>
  <text x="1260" y="126" class="head" text-anchor="middle">산출과 경계</text>

  <rect x="28" y="145" width="1344" height="136" rx="15" fill="#f5f5f5"/>
  <rect x="28" y="294" width="1344" height="136" rx="15" fill="#f5f5f5"/>
  <rect x="28" y="443" width="1344" height="136" rx="15" fill="#f5f5f5"/>

  <rect x="42" y="166" width="218" height="94" rx="12" fill="#e8ebef" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="58" y="202" class="lane-title">블록 반복</text>
  <text x="58" y="228" class="lane-sub">Hamiltonian stitching</text>
  <rect x="318" y="166" width="204" height="94" rx="12" fill="#fff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="420" y="200" class="box-title" text-anchor="middle">짧은 DFT</text>
  <text x="420" y="224" class="box-copy" text-anchor="middle">H₀, S₀ 및 층간 결합</text>
  <path d="M526 213 H558" class="arrow"/>
  <rect x="570" y="166" width="204" height="94" rx="12" fill="#fff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="672" y="200" class="box-title" text-anchor="middle">principal layer 조립</text>
  <text x="672" y="224" class="box-copy" text-anchor="middle">반복 구간 n개 연결</text>
  <path d="M778 213 H810" class="arrow"/>
  <rect x="822" y="166" width="204" height="94" rx="12" fill="#fff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="924" y="200" class="box-title" text-anchor="middle">NEGF / RGF</text>
  <text x="924" y="224" class="box-copy" text-anchor="middle">고정된 행렬로 수송 계산</text>
  <path d="M1030 213 H1062" class="arrow"/>
  <rect x="1074" y="166" width="270" height="94" rx="12" fill="#fff" stroke="#bf4520" stroke-width="1.5"/>
  <text x="1209" y="200" class="box-title" text-anchor="middle">전송 T(E)</text>
  <text x="1209" y="224" class="box-copy" text-anchor="middle">새 전하·게이트 전위는 자동 갱신 안 됨</text>

  <rect x="42" y="315" width="218" height="94" rx="12" fill="#e8ebef" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="58" y="351" class="lane-title">Order-N DFT</text>
  <text x="58" y="377" class="lane-sub">큰 계 전자구조 solver</text>
  <rect x="318" y="315" width="204" height="94" rx="12" fill="#fff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="420" y="349" class="box-title" text-anchor="middle">큰 원자 구조</text>
  <text x="420" y="373" class="box-copy" text-anchor="middle">목표 구조 전체를 입력</text>
  <path d="M526 362 H558" class="arrow"/>
  <rect x="570" y="315" width="204" height="94" rx="12" fill="#fff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="672" y="349" class="box-title" text-anchor="middle">국소성 이용</text>
  <text x="672" y="373" class="box-copy" text-anchor="middle">희소 H, 밀도행렬 또는 궤도</text>
  <path d="M778 362 H810" class="arrow"/>
  <rect x="822" y="315" width="204" height="94" rx="12" fill="#fff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="924" y="349" class="box-title" text-anchor="middle">O(N) solver</text>
  <text x="924" y="373" class="box-copy" text-anchor="middle">전자구조 자기일관 계산</text>
  <path d="M1030 362 H1062" class="arrow"/>
  <rect x="1074" y="315" width="270" height="94" rx="12" fill="#fff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="1209" y="349" class="box-title" text-anchor="middle">밀도와 에너지</text>
  <text x="1209" y="373" class="box-copy" text-anchor="middle">수송은 별도의 NEGF 단계</text>

  <rect x="42" y="464" width="218" height="94" rx="12" fill="#e8ebef" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="58" y="500" class="lane-title">ML Hamiltonian</text>
  <text x="58" y="526" class="lane-sub">국소 모델의 예측</text>
  <rect x="318" y="464" width="204" height="94" rx="12" fill="#fff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="420" y="498" class="box-title" text-anchor="middle">작은 DFT 자료</text>
  <text x="420" y="522" class="box-copy" text-anchor="middle">학습 + 긴 구조 원자 좌표</text>
  <path d="M526 511 H558" class="arrow"/>
  <rect x="570" y="464" width="204" height="94" rx="12" fill="#fff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="672" y="498" class="box-title" text-anchor="middle">국소 H 예측</text>
  <text x="672" y="522" class="box-copy" text-anchor="middle">원자 환경별 블록 조립</text>
  <path d="M778 511 H810" class="arrow"/>
  <rect x="822" y="464" width="204" height="94" rx="12" fill="#fff" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="924" y="498" class="box-title" text-anchor="middle">NEGF / RGF</text>
  <text x="924" y="522" class="box-copy" text-anchor="middle">Poisson은 모델에 따라 추가</text>
  <path d="M1030 511 H1062" class="arrow"/>
  <rect x="1074" y="464" width="270" height="94" rx="12" fill="#fff" stroke="#bf4520" stroke-width="1.5"/>
  <text x="1209" y="498" class="box-title" text-anchor="middle">전송 T(E)</text>
  <text x="1209" y="522" class="box-copy" text-anchor="middle">학습 범위 밖 구조는 따로 검증</text>

  <text x="44" y="615" class="foot">블록 반복은 행렬 조립, Order-N은 전체 계 전자구조, ML은 Hamiltonian 예측이다. 선형 스케일링과 물리적 정확도는 별도로 확인한다.</text>
</svg>
