<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="landauer-buttiker-probes-title landauer-buttiker-probes-desc" id="landauer-buttiker-probes-root">
<title id="landauer-buttiker-probes-title">Landauer–Büttiker currents and probe conditions</title>
<desc id="landauer-buttiker-probes-desc">Directional transmissions from multiple reservoirs enter a signed terminal-current balance; voltage, thermal and dephasing probes impose different zero-current conditions.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #landauer-buttiker-probes-root { font-family: system-ui, sans-serif; }
      #landauer-buttiker-probes-root .diagram-container { width:100%;overflow-x:auto }</style>
 <marker id="landauer-buttiker-probes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#4f5d75"/></marker>
 <marker id="landauer-buttiker-probes-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#bf4520"/></marker>
</defs>
<rect width="1100" height="560" fill="#f5f5f5"/>
<text x="44" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1.4" fill="#4f5d75">MULTI-TERMINAL TRANSPORT</text>
<rect x="42" y="104" width="240" height="110" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="162.0" y="133" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >M reservoirs</text><text x="162.0" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >μα, Θα, fα(E)</text><path d="M282 159 H324" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#landauer-buttiker-probes-arrow)"/><rect x="324" y="104" width="240" height="110" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.4"/><text x="444.0" y="133" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >directed transmission</text><text x="444.0" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >Tαβ(E): α → β</text><path d="M564 159 H606" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#landauer-buttiker-probes-arrow-accent)"/><rect x="606" y="104" width="432" height="110" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="822.0" y="133" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >signed terminal balance</text><text x="822.0" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >JαN = h⁻¹ ∑σ,β ∫ dE [Tαβ,σ fα − Tβα,σ fβ]</text><text x="550" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4f5d75" >probe는 선택한 경계조건으로 정의한다</text><path d="M822 214 V314 H205 M822 314 H870" fill="none" stroke="#4f5d75" stroke-width="1.2"/><path d="M205 314 V350" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#landauer-buttiker-probes-arrow)"/><path d="M535 314 V350" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#landauer-buttiker-probes-arrow)"/><path d="M870 314 V350" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#landauer-buttiker-probes-arrow)"/><rect x="48" y="350" width="314" height="116" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="205.0" y="379" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >voltage probe</text><text x="205.0" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >적분 입자 유량 JpN = 0</text><rect x="378" y="350" width="314" height="116" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.4"/><text x="535.0" y="379" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >voltage–temperature probe</text><text x="535.0" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >JpN = 0,  JpQ = 0</text><rect x="708" y="350" width="314" height="116" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="865.0" y="379" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >dephasing probe</text><text x="865.0" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >에너지별 JpN(E) = 0</text><text x="550" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#4f5d75" >방향별 Tαβ를 따로 둔다. 자기장이 있으면 Tαβ = Tβα를 일반적으로 가정하지 않는다.</text>
</svg>
