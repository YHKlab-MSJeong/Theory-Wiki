<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mobility-title mobility-desc" id="mobility-overview-root"><title id="mobility-title">Mobility and scattering overview</title><desc id="mobility-desc">An inversion-layer mobility is measured from charge and conductivity, while separate scattering models contribute through assumptions that must be checked before combining rates.</desc><defs>
