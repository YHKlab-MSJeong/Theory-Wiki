      #mobility-overview-root { font-family: system-ui,sans-serif; }
      #mobility-overview-root .diagram-container { width:100%;overflow-x:auto }</style><marker id="mobility-overview-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#4f5d75"/></marker><marker id="mobility-overview-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#bf4520"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><rect x="44" y="62" width="872" height="186" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity=".02" stroke-opacity=".18"/><text x="64" y="86" font-size="11" fill="#4f5d75" letter-spacing=".14em">MEASURED QUANTITY</text><path d="M212 170H292M440 170H520M668 170H748" stroke="#4f5d75" fill="none" marker-end="url(#mobility-overview-a)"/><rect x="64" y="124" width="148" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="138" y="158" text-anchor="middle" font-size="16" font-weight="600">Qinv</text><text x="138" y="182" text-anchor="middle" font-size="11" fill="#4f5d75">charge / CV</text><rect x="292" y="124" width="148" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="366" y="158" text-anchor="middle" font-size="16" font-weight="600">σs, ID</text><text x="366" y="182" text-anchor="middle" font-size="11" fill="#4f5d75">conductivity</text><rect x="520" y="124" width="148" height="92" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity=".08"/><text x="594" y="158" text-anchor="middle" font-size="16" font-weight="600">μeff</text><text x="594" y="182" text-anchor="middle" font-size="11" fill="#4f5d75">σs / qns</text><rect x="748" y="124" width="148" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="822" y="158" text-anchor="middle" font-size="16" font-weight="600">Scope</text><text x="822" y="182" text-anchor="middle" font-size="11" fill="#4f5d75">L, T, VDS,int</text><path d="M594 216V334" stroke="#bf4520" stroke-width="1.4" fill="none" marker-end="url(#mobility-overview-b)"/><path d="M240 380H292M440 380H492M640 380H692" stroke="#4f5d75" fill="none" marker-end="url(#mobility-overview-a)"/><rect x="72" y="334" width="168" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="156" y="368" text-anchor="middle" font-size="15" font-weight="600">phonon</text><text x="156" y="391" text-anchor="middle" font-size="11" fill="#4f5d75">τ(E), T</text><rect x="292" y="334" width="148" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="366" y="368" text-anchor="middle" font-size="15" font-weight="600">roughness</text><text x="366" y="391" text-anchor="middle" font-size="11" fill="#4f5d75">C(r), S(q)</text><rect x="492" y="334" width="148" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="566" y="368" text-anchor="middle" font-size="15" font-weight="600">defect</text><text x="566" y="391" text-anchor="middle" font-size="11" fill="#4f5d75">charge, screening</text><rect x="692" y="334" width="196" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="790" y="368" text-anchor="middle" font-size="15" font-weight="600">combination</text><text x="790" y="391" text-anchor="middle" font-size="11" fill="#4f5d75">Matthiessen? check</text><line x1="48" y1="472" x2="912" y2="472" stroke="#2d3142" stroke-opacity=".18"/><text x="56" y="496" font-size="12" fill="#4f5d75">모델별 rate를 mobility 역수로 더하기 전, energy·subband·contact 정의와 근사를 먼저 확인한다.</text></svg>
