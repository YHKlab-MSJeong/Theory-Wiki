<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scba-fixed-point-title scba-fixed-point-desc" id="scba-fixed-point-root">
  <title id="scba-fixed-point-title">SCBA Green-function fixed-point iteration and separate diagnostics</title>
  <desc id="scba-fixed-point-desc">The current retarded and lesser Green functions define a scattering self energy. Dyson and Keldysh equations produce the next fixed-point image. The unmixed fixed-point residual selects a convergence candidate or the next mixed iterate. Current mismatch, grid stability, causality and optional electrostatic convergence are separate checks.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #scba-fixed-point-root { font-family: system-ui, sans-serif; }
      #scba-fixed-point-root .diagram-container { width: 100%; overflow-x: auto; }</style>
    <marker id="scba-fixed-point-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#4f5d75"/></marker>
    <marker id="scba-fixed-point-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#bf4520"/></marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <rect x="28" y="64" width="916" height="424" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity=".02" stroke-opacity=".18"/>
  <rect x="44" y="68" width="190" height="18" rx="2" fill="#f5f5f5"/>
  <text x="52" y="82" font-size="8" font-weight="600" letter-spacing="1.2" fill="#4f5d75">SCBA ITERATION</text>

  <path d="M168 268H208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#scba-fixed-point-arrow)"/>
  <path d="M368 268H408" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#scba-fixed-point-arrow)"/>
  <path d="M584 268H628" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#scba-fixed-point-arrow-accent)"/>
  <path d="M788 268H820" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#scba-fixed-point-arrow)"/>
  <rect x="784" y="232" width="36" height="20" rx="3" fill="#f5f5f5"/>
  <text x="802" y="246" text-anchor="middle" font-size="12" fill="#4f5d75">yes</text>
  <path d="M708 344V372H520V440H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#scba-fixed-point-arrow)"/>
  <rect x="548" y="362" width="44" height="20" rx="3" fill="#f5f5f5"/>
  <text x="570" y="376" text-anchor="middle" font-size="12" fill="#4f5d75">no</text>
  <path d="M280 440H204V320H104V312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#scba-fixed-point-arrow)"/>

  <rect x="40" y="224" width="128" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="104" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Current Gₙ</text>
  <text x="104" y="288" text-anchor="middle" font-size="12" fill="#4f5d75">Grₙ, G&lt;ₙ</text>

  <rect x="208" y="224" width="160" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="288" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Scattering Σ</text>
  <text x="288" y="288" text-anchor="middle" font-size="12" fill="#4f5d75">Σscatt[Gₙ]</text>

  <rect x="408" y="224" width="176" height="88" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity=".08"/>
  <text x="496" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Dyson + Keldysh</text>
  <text x="496" y="288" text-anchor="middle" font-size="12" fill="#4f5d75">F[Gₙ] candidate</text>

  <polygon points="708,192 788,268 708,344 628,268" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="708" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Residual</text>
  <text x="708" y="280" text-anchor="middle" font-size="12" fill="#4f5d75">‖F[Gₙ]−Gₙ‖</text>
  <text x="708" y="300" text-anchor="middle" font-size="12" fill="#4f5d75">≤ tolerance?</text>

  <rect x="280" y="396" width="200" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="380" y="434" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Mix / update</text>
  <text x="380" y="460" text-anchor="middle" font-size="12" fill="#4f5d75">Gₙ₊₁ (scheme-dependent)</text>

  <rect x="828" y="224" width="100" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="878" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Candidate</text>
  <text x="878" y="288" text-anchor="middle" font-size="12" fill="#4f5d75">checks remain</text>

  <line x1="48" y1="520" x2="912" y2="520" stroke="#2d3142" stroke-opacity=".18"/>
  <text x="56" y="548" font-size="12" fill="#4f5d75">Current mismatch, grid/window stability and causality are separate checks; Poisson residual applies only when electrostatics is coupled.</text>
  <text x="56" y="572" font-size="12" fill="#4f5d75">Small update or conserved current alone does not establish fixed-point accuracy or physical validity.</text>
</svg>
