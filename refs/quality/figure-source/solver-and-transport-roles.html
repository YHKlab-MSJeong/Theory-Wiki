<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>전자구조 solver와 수송 모델의 역할 비교</title>
<style>body{margin:0;padding:24px;background:#f6f5f1;font:16px system-ui,sans-serif;color:#19343d}main{max-width:1280px;margin:auto}svg{display:block;width:100%;height:auto}</style></head>
<body><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">전자구조 solver와 Hamiltonian 블록 확장 수송의 역할 비교</title>
<desc id="diagram-desc">큰 구조의 self-consistent 전자구조를 계산하는 solver 경로와 이미 구한 작은 Hamiltonian 블록을 반복 조립해 RGF 수송을 계산하는 경로를 구분한다.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61747a"/></marker>
  <style>
    .bg{fill:#f6f5f1}.title{font:700 26px system-ui,sans-serif;fill:#19343d}.sub{font:15px system-ui,sans-serif;fill:#52666c}
    .panel{fill:#fff;stroke:#c6d0cf;stroke-width:2;rx:14}.paneltitle{font:700 19px system-ui,sans-serif;fill:#19343d}
    .box{fill:#f9fbfa;stroke:#9aabaa;stroke-width:2;rx:10}.teal{fill:#e5f1ef;stroke:#2f7b74;stroke-width:2;rx:10}.gold{fill:#fbf1d9;stroke:#c89328;stroke-width:2;rx:10}
    .h{font:700 16px system-ui,sans-serif;fill:#19343d}.b{font:14px system-ui,sans-serif;fill:#465c62}.small{font:13px system-ui,sans-serif;fill:#50646b}
    .arrow{fill:none;stroke:#61747a;stroke-width:2.5;marker-end:url(#arr)}.dashed{fill:none;stroke:#61747a;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arr)}
    .label{font:700 12px system-ui,sans-serif;letter-spacing:1px;fill:#2f7b74}
  </style>
</defs>
<rect class="bg" width="1280" height="620"/>
<text class="title" x="42" y="49">계산 목표에 따라 사용하는 방법이 다르다</text>
<text class="sub" x="42" y="77">OMM·PEXSI·CheSS는 전자구조를 푸는 알고리즘 계열이다. 블록 반복과 RGF는 장채널 수송 모델을 구성한다.</text>
<rect class="panel" x="38" y="112" width="586" height="420" rx="14"/>
<text class="paneltitle" x="62" y="150">A · 큰 구조의 전자구조</text>
<text class="small" x="62" y="176">Kohn–Sham SCF에서 밀도행렬 또는 점유 부분공간을 계산</text>
<rect class="box" x="65" y="212" width="142" height="78"/><text class="h" x="84" y="242">원자 구조</text><text class="b" x="84" y="266">기저와 조건</text>
<path class="arrow" d="M207 251H245"/>
<rect class="box" x="249" y="212" width="106" height="78"/><text class="h" x="275" y="242">H, S</text><text class="b" x="268" y="266">행렬 생성</text>
<path class="arrow" d="M355 251H389"/>
<rect class="teal" x="394" y="199" width="199" height="105"/>
<text class="label" x="412" y="225">SOLVER 선택</text><text class="h" x="412" y="251">대각화 · OMM</text><text class="h" x="412" y="274">PEXSI · CheSS</text><text class="small" x="412" y="294">ELSI는 backend 인터페이스</text>
<path class="arrow" d="M494 304V346"/>
<rect class="box" x="393" y="350" width="200" height="72"/><text class="h" x="412" y="380">밀도행렬 / 점유</text><text class="b" x="412" y="403">전자수 · 에너지 · 힘</text>
<path class="arrow" d="M393 386H330V456H294"/>
<rect class="box" x="93" y="430" width="202" height="72"/><text class="h" x="113" y="460">전하 갱신 · SCF 반복</text><text class="b" x="113" y="483">수렴한 큰 구조의 상태</text>
<path class="dashed" d="M190 430V323H119V290"/>
<text class="small" x="104" y="351">자기일관 반복</text>
<rect class="panel" x="656" y="112" width="586" height="420" rx="14"/>
<text class="paneltitle" x="680" y="150">B · 긴 채널 수송 모델</text>
<text class="small" x="680" y="176">이미 얻은 대표 블록을 연결해 열린 경계 전송을 계산</text>
<rect class="box" x="684" y="212" width="142" height="78"/><text class="h" x="704" y="242">짧은 DFT</text><text class="b" x="704" y="266">H, S 블록</text>
<path class="arrow" d="M826 251H864"/>
<rect class="gold" x="868" y="199" width="153" height="105"/><text class="h" x="887" y="235">블록 반복</text><text class="h" x="887" y="260">+ 층간 결합</text><text class="small" x="887" y="285">채널 구조 가정</text>
<path class="arrow" d="M1021 251H1058"/>
<rect class="teal" x="1062" y="212" width="145" height="78"/><text class="h" x="1082" y="242">RGF / NEGF</text><text class="b" x="1082" y="266">전송 계산</text>
<path class="arrow" d="M1135 290V347"/>
<rect class="box" x="1034" y="351" width="175" height="72"/><text class="h" x="1054" y="381">T(E) · I(V)</text><text class="b" x="1054" y="404">전달량 / 전류</text>
<rect x="680" y="447" width="535" height="55" rx="10" fill="#f5e9e4"/>
<text class="small" x="699" y="470">복제만으로 새 구조의 전하와 전위를 SCF 계산하지 않는다.</text>
<text class="small" x="699" y="490">ELSI·OMM·PEXSI·CheSS 자체가 블록 반복 또는 RGF는 아니다.</text>
<text class="small" x="42" y="575">비교 도식: 실제 solver 지원과 계산량은 코드·빌드·기저 희소성·크기·수렴 조건에 따라 달라진다.</text>
</svg>
</main></body></html>
