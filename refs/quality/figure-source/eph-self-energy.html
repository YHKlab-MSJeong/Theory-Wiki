  <title id="selfenergy-title">Fan–Migdal과 Debye–Waller self-energy</title>
  <desc id="selfenergy-desc">일차 전자–포논 결합과 중간 전자·포논 상태가 동적 Fan–Migdal 항을 만들고, 이차 퍼텐셜 응답이 정적 Debye–Waller 항을 만든다. 두 항은 self-energy의 실수부 에너지 이동에 기여하고, 이 조화 대각 근사에서 Fan–Migdal 항의 허수부가 스펙트럼 폭과 수명에 연결된다.</desc>

  </defs>

  <rect x="355" y="265" width="220" height="100" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="465" y="308" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3142">Debye–Waller</text>
