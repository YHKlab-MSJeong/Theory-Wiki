<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>전자–포논 결합 계산 흐름</title>
  <style>body{margin:0;background:#f5f5f5;font-family:system-ui,sans-serif}.frame{padding:24px}svg{display:block;width:100%;min-width:1080px}</style>
</head>
<body><div class="frame">
<svg viewBox="0 0 1240 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eph-title eph-desc">
  <title id="eph-title">힘상수와 DFPT 응답에서 전자–포논 결합 행렬원소로</title>
  <desc id="eph-desc">힘상수에서 동역학 행렬과 포논 모드를 얻는다. 별도의 DFPT 원자변위 퍼텐셜 응답에 포논 모드를 투영해 모드 퍼텐셜 변화를 만들고, 두 전자 Bloch 상태 사이의 행렬원소 g를 계산한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#bf4520"/></marker>
  </defs>
  <rect width="1240" height="500" fill="#f5f5f5"/>
  <path d="M210 144H280" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M470 144H540" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M730 144H752Q760 144 760 152V232Q760 240 768 240H887Q895 240 895 248V270" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <path d="M990 314H1020" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="30" y="100" width="180" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="120" y="137" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3142">힘상수 Φ</text>
  <text x="120" y="163" text-anchor="middle" font-size="12" fill="#4f5d75">에너지 2차 미분</text>
  <rect x="280" y="100" width="190" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="375" y="137" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3142">동역학 행렬 D(q)</text>
  <text x="375" y="163" text-anchor="middle" font-size="12" fill="#4f5d75">Fourier + 질량 가중</text>
  <rect x="540" y="100" width="190" height="88" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/>
  <text x="635" y="137" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3142">포논 고유모드</text>
  <text x="635" y="163" text-anchor="middle" font-size="12" fill="#4f5d75">ωqν · 정규화 e</text>
  <rect x="360" y="300" width="230" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="475" y="337" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3142">DFPT 변위 응답</text>
  <text x="475" y="363" text-anchor="middle" font-size="12" fill="#4f5d75">∂VKS / ∂u</text>
  <rect x="800" y="270" width="190" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="895" y="307" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3142">모드 투영 ΔqνVKS</text>
  <text x="895" y="333" text-anchor="middle" font-size="12" fill="#4f5d75">영점 진동 진폭 포함</text>
  <rect x="1020" y="270" width="190" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="1115" y="307" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3142">EPC 행렬원소 g</text>
  <text x="1115" y="333" text-anchor="middle" font-size="11" fill="#4f5d75">&lt;u m,k+q | ΔV | u n,k&gt;</text>
</svg>
</div></body>
</html>
