<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>유전 응답 분해</title>
  <style>body{margin:0;background:#f5f5f5;font-family:system-ui,sans-serif}.frame{padding:24px}svg{display:block;width:100%;min-width:760px}</style>
</head>
<body><div class="frame">
<svg viewBox="0 0 920 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dielectric-title dielectric-desc">
  <title id="dielectric-title">전자 및 이온 응답의 유전 텐서 분해</title>
  <desc id="dielectric-desc">고정 이온 전자 응답은 epsilon infinity를 만들고 Born 유효전하와 포논 모드는 이온 기여를 만든다. 두 항이 정적 유전 텐서로 합쳐진다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#bf4520"/></marker>
  </defs>
  <rect width="920" height="430" fill="#f5f5f5"/>
  <path d="M280 145H365" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M280 315H317Q325 315 325 307V293Q325 285 333 285H365" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M555 145H602Q610 145 610 153V212Q610 220 618 220H665" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M555 285H602Q610 285 610 277V238Q610 230 618 230H665" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <rect x="40" y="100" width="240" height="90" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="160" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3142">고정 이온 전자 응답</text>
  <text x="160" y="165" text-anchor="middle" font-size="13" fill="#4f5d75">ε∞</text>
  <rect x="40" y="270" width="240" height="90" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="160" y="309" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3142">Born 유효전하 + 포논 모드</text>
  <text x="160" y="335" text-anchor="middle" font-size="12" fill="#4f5d75">Z* · ω · 고유벡터</text>
  <rect x="365" y="100" width="190" height="90" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="460" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3142">전자 항</text>
  <text x="460" y="165" text-anchor="middle" font-size="13" fill="#4f5d75">ε∞</text>
  <rect x="365" y="240" width="190" height="90" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/>
  <text x="460" y="279" text-anchor="middle" font-size="15" font-weight="600" fill="#2d3142">이온 격자 항</text>
  <text x="460" y="305" text-anchor="middle" font-size="13" fill="#4f5d75">εion(0)</text>
  <rect x="665" y="175" width="215" height="100" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="772" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">전체 유전 응답</text>
  <text x="772" y="245" text-anchor="middle" font-size="14" fill="#4f5d75">ε(0) = ε∞ + εion(0)</text>
</svg>
</div></body>
</html>
