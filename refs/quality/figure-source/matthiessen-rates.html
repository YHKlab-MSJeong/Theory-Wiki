<title id="matthiessen-rates-title">Matthiessen rate addition and mobility averaging</title>
<desc id="matthiessen-rates-desc">Independent scattering rates can be approximately added at fixed energy; converting that result into inverse effective mobilities requires preserving the transport weighting and checking the total response.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#4f5d75"/></marker>

<rect width="1100" height="550" fill="#f5f5f5"/>
<text x="44" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1.4" fill="#4f5d75">SCATTERING-RATE ACCOUNTING</text>
<rect x="38" y="145" width="218" height="112" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="147.0" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >independent channels</text><text x="147.0" y="199" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >phonon · defect</text><text x="147.0" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >roughness · impurity</text><path d="M256 201 H300" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="300" y="145" width="236" height="112" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.4"/><text x="418.0" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >rate-level sum</text><text x="418.0" y="199" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >1/τtot(E) ≈ ∑i 1/τi(E)</text><path d="M536 201 H580" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="580" y="145" width="228" height="112" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="694.0" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >transport weighting</text><text x="694.0" y="199" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >states · velocity</text><text x="694.0" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >energy and subbands</text><path d="M808 201 H852" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="852" y="145" width="210" height="112" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="957.0" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >effective response</text><text x="957.0" y="199" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >μeff</text><text x="550" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4f5d75" >이동도 역수 가산은 더 강한 근사</text><rect x="186" y="365" width="728" height="92" rx="6" fill="rgba(191,69,32,.06)" stroke="#bf4520" stroke-width="1.4"/><text x="550.0" y="394" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#2d3142" >1/μeff ≈ ∑i 1/μi</text><text x="550.0" y="419" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#4f5d75" >같은 carrier 정의와 weighting을 유지하고, 전체 response와 직접 비교할 때만 검토</text><text x="550" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#4f5d75" >에너지별 산란률 가산이 평균된 이동도 역수 가산을 자동으로 보장하지 않는다.</text>
