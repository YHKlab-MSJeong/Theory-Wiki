<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DFTH-NEGF 계산 경로</title>
<style>body{margin:0;padding:24px;background:#f6f5f1;font:16px system-ui,sans-serif;color:#19343d}main{max-width:1320px;margin:auto}.diagram-container{overflow-x:auto}svg{display:block;width:100%;min-width:1280px;height:auto}</style></head>
<body><main><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-labelledby="dfth-title dfth-desc">
<title id="dfth-title">Full-NEGF와 DFTH-NEGF workflow</title>
<desc id="dfth-desc">Full-NEGF는 열린 경계 Green 함수에서 계산한 밀도와 전위를 Hamiltonian에 되먹임해 수렴시킨다. DFTH-NEGF는 주기 ground-state DFT로 얻은 Hamiltonian을 고정하고 전극 self-energy를 결합해 transmission을 계산하되 transport 자기일관 갱신을 하지 않는다.</desc>
<defs>
  <marker id="dfth-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61747a"/></marker>
  <style>
    .dbg{fill:#f6f5f1}.dtitle{font:700 27px system-ui,sans-serif;fill:#19343d}.dsub{font:15px system-ui,sans-serif;fill:#52666c}
    .dbox{fill:#fff;stroke:#b8c6c4;stroke-width:2}.dteal{fill:#e5f1ef;stroke:#2f7b74;stroke-width:2}.dgold{fill:#fbf1d9;stroke:#c89328;stroke-width:2}.dred{fill:#f5e9e4;stroke:#af5b4d;stroke-width:2}
    .dh{font:700 16px system-ui,sans-serif;fill:#19343d}.db{font:14px system-ui,sans-serif;fill:#465c62}.dsmall{font:13px system-ui,sans-serif;fill:#50646b}.dtag{font:700 13px system-ui,sans-serif;letter-spacing:1px;fill:#2f7b74}
    .darrow{fill:none;stroke:#61747a;stroke-width:2.5;marker-end:url(#dfth-arrow)}.ddash{fill:none;stroke:#af5b4d;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#dfth-arrow)}
  </style>
</defs>
<rect class="dbg" width="1280" height="680"/>
<text class="dtitle" x="40" y="48">DFTH-NEGF: 열린경계 수송은 계산하고 Hamiltonian 되먹임은 생략</text>
<text class="dsub" x="40" y="76">DFTH는 HamGNN 논문에서 사용한 용어다. 여기서는 conventional DFT Hamiltonian을 고정 입력으로 쓴다.</text>
<text class="dtag" x="44" y="120">FULL-NEGF · OPEN-BOUNDARY SELF-CONSISTENCY</text>
<path class="darrow" d="M236 190H272"/><path class="darrow" d="M468 190H504"/><path class="darrow" d="M700 190H736"/><path class="darrow" d="M932 190H968"/>
<rect class="dbox" x="40" y="142" width="196" height="96" rx="12"/><text class="dh" x="58" y="176">초기 DFT</text><text class="db" x="58" y="202">H_C, S_C</text><text class="db" x="58" y="224">초기 전하</text>
<rect class="dbox" x="272" y="142" width="196" height="96" rx="12"/><text class="dh" x="290" y="176">전극 Σ + Gʳ(E)</text><text class="db" x="290" y="202">열린 경계 계산</text><text class="db" x="290" y="224">현재 H로 풀이</text>
<rect class="dbox" x="504" y="142" width="196" height="96" rx="12"/><text class="dh" x="522" y="176">NEGF 밀도</text><text class="db" x="522" y="202">ρ · n(r)</text><text class="db" x="522" y="224">전극 점유 반영</text>
<rect class="dred" x="736" y="142" width="196" height="96" rx="12"/><text class="dh" x="754" y="176">DFT Hamiltonian 갱신</text><text class="db" x="754" y="202">전위 · HKS update</text><text class="db" x="754" y="224">미수렴이면 반복</text>
<rect class="dteal" x="968" y="142" width="196" height="96" rx="12"/><text class="dh" x="986" y="176">수렴 뒤 T(E)</text><text class="db" x="986" y="202">최종 열린계 H</text><text class="db" x="986" y="224">transport observable</text>
<path class="ddash" d="M834 238V270Q834 278 826 278H378Q370 278 370 270V240"/>
<text class="dsmall" x="558" y="300">열린계 전하가 Hamiltonian을 갱신하는 피드백</text>
<text class="dtag" x="44" y="356">DFTH-NEGF · STATIC DEVICE HAMILTONIAN</text>
<path class="darrow" d="M390 446H452"/><path class="darrow" d="M752 446H812"/>
<rect class="dteal" x="40" y="394" width="350" height="104" rx="12"/><text class="dh" x="60" y="427">정적 ground-state DFT</text><text class="db" x="60" y="453">device H_C, S_C</text><text class="db" x="60" y="478">bulk lead Hα, Sα도 입력</text>
<rect class="dbox" x="452" y="394" width="300" height="104" rx="12"/><text class="dh" x="472" y="427">전극 Σ(E) + Green 함수</text><text class="db" x="472" y="453">lead 표면상태를 device에 결합</text><text class="db" x="472" y="478">수송 전하로 H_C 갱신 안 함</text>
<rect class="dgold" x="812" y="394" width="300" height="104" rx="12"/><text class="dh" x="832" y="427">Transmission T(E)</text><text class="db" x="832" y="453">열린 경계 NEGF 계산</text><text class="db" x="832" y="478">SCF 재계산 없음</text>
<rect class="dred" x="40" y="534" width="1124" height="62" rx="11"/>
<text class="dh" x="62" y="572">구분</text><text class="db" x="128" y="572">전극 Σ와 Green 함수는 유지한다. 생략하는 단계는 수송 밀도에 따른 device Hamiltonian 갱신이다.</text>
<text class="dsmall" x="40" y="622">HamGNN-NEGF는 정적 DFT Hamiltonian 대신 학습 모델이 예측한 Hamiltonian을 수송 계산에 넣는다.</text>
</svg></div></main></body></html>
