<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HamGNN-NEGF 계산 흐름</title>
<style>body{margin:0;padding:24px;background:#f6f5f1;font:16px system-ui,sans-serif;color:#19343d}main{max-width:1280px;margin:auto}svg{display:block;width:100%;height:auto}</style></head>
<body><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 650" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">HamGNN-NEGF workflow</title>
<desc id="diagram-desc">소규모 DFT Hamiltonian과 overlap 자료로 모델을 학습하고, 큰 구조의 Hamiltonian을 예측해 DFT 전극 self-energy, 비직교 KPM, RGF로 전송을 계산한다. 큰 장치 overlap 구성은 논문에서 명확하지 않다.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61747a"/></marker>
  <style>
    .bg{fill:#f6f5f1}.title{font:700 26px system-ui,sans-serif;fill:#19343d}.sub{font:15px system-ui,sans-serif;fill:#52666c}
    .box{fill:#fff;stroke:#b8c6c4;stroke-width:2;rx:11}.teal{fill:#e5f1ef;stroke:#2f7b74;stroke-width:2;rx:11}.gold{fill:#fbf1d9;stroke:#c89328;stroke-width:2;rx:11}.red{fill:#f5e9e4;stroke:#af5b4d;stroke-width:2;rx:11}
    .h{font:700 17px system-ui,sans-serif;fill:#19343d}.b{font:14px system-ui,sans-serif;fill:#465c62}.small{font:13px system-ui,sans-serif;fill:#50646b}.tag{font:700 12px system-ui,sans-serif;letter-spacing:1px;fill:#2f7b74}
    .arrow{fill:none;stroke:#61747a;stroke-width:2.5;marker-end:url(#arr)}.dash{fill:none;stroke:#61747a;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arr)}
  </style>
</defs>
<rect class="bg" width="1260" height="650"/>
<text class="title" x="42" y="48">HamGNN-NEGF: 작은 구조에서 학습하고 큰 장치 행렬을 예측</text>
<text class="sub" x="42" y="77">DFT-NEGF 전류를 학습 label로 만들지 않지만, 학습용 DFT 행렬과 전극 자료는 필요하다.</text>
<text class="tag" x="48" y="120">TRAINING DATA</text>
<rect class="box" x="45" y="140" width="215" height="92"/><text class="h" x="66" y="174">작은 주기 구조</text><text class="b" x="66" y="199">ground-state DFT</text><text class="b" x="66" y="220">H 와 S 행렬</text>
<path class="arrow" d="M260 186H315"/>
<rect class="teal" x="319" y="140" width="240" height="92"/><text class="h" x="341" y="174">HamGNN 학습</text><text class="b" x="341" y="199">E(3)-equivariant GNN</text><text class="b" x="341" y="220">원자 환경 → H</text>
<path class="dash" d="M439 232V290H151"/>
<text class="small" x="165" y="280">학습 후 예측 단계</text>
<text class="tag" x="48" y="325">DEVICE INFERENCE</text>
<rect class="box" x="45" y="347" width="215" height="92"/><text class="h" x="66" y="381">큰 장치 구조</text><text class="b" x="66" y="406">원자종 · 좌표</text><text class="b" x="66" y="427">결함 · 도핑 · 접촉</text>
<path class="arrow" d="M260 393H315"/>
<rect class="teal" x="319" y="347" width="240" height="92"/><text class="h" x="341" y="381">예측된 Hamiltonian</text><text class="b" x="341" y="406">Hdevice</text><text class="b" x="341" y="427">S 구성은 원문에 불명확</text>
<path class="arrow" d="M559 393H606"/>
<rect class="box" x="610" y="347" width="195" height="92"/><text class="h" x="631" y="381">정적 DFTH-NEGF</text><text class="b" x="631" y="406">장치 행렬 + 전극</text><text class="b" x="631" y="427">self-energy</text>
<path class="arrow" d="M805 393H850"/>
<rect class="gold" x="854" y="347" width="170" height="92"/><text class="h" x="874" y="381">비직교 KPM</text><text class="b" x="874" y="406">DOS moments</text><text class="b" x="874" y="427">전자수 → μ</text>
<path class="arrow" d="M1024 393H1066"/>
<rect class="teal" x="1070" y="347" width="150" height="92"/><text class="h" x="1091" y="381">RGF</text><text class="b" x="1091" y="406">T(E)</text><text class="b" x="1091" y="427">전류 적분</text>
<rect class="box" x="610" y="177" width="195" height="76"/><text class="h" x="631" y="207">벌크 DFT 전극</text><text class="b" x="631" y="231">ΣL(E), ΣR(E)</text>
<path class="arrow" d="M707 253V347"/>
<rect class="red" x="45" y="493" width="1175" height="76" rx="11"/>
<text class="h" x="68" y="523">계산 경계</text><text class="b" x="68" y="548">열린 경계의 매 transport SCF 반복은 생략한다. 유한 bias는 zero-bias H₀ 근사이며, 논문은 약한 비선형 영역에 한정한다.</text>
<text class="small" x="48" y="607">저자 보고: 단면·layer 크기와 계산 설정을 고정하면 채널 길이에 선형으로 비례.</text>
</svg>
</main></body></html>
