site_name: Minsu's Theory Wiki
theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Device physics:
      - Overview: device-physics/index.md
  - Material science:
      - Overview: computational-materials-science/index.md
      - Quantum transport:
          - Overview: computational-materials-science/quantum-transport/index.md
          - NEGF: computational-materials-science/quantum-transport/negf.md
          - Landauer transport: computational-materials-science/quantum-transport/landauer-transmission.md
          - Landauer–Büttiker transport: computational-materials-science/quantum-transport/landauer-buttiker.md
  - Computational science:
      - Overview: computational-science/index.md
