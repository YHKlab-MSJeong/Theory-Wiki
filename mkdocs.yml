site_name: Minsu's Theory Wiki
repo_url: https://github.com/YHKlab-MSJeong/Theory-Wiki
edit_uri: edit/main/docs/
theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - navigation.footer
    - toc.follow
    - content.action.edit
markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Device physics:
