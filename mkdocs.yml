site_name: Minsu's Theory Wiki
theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Quantum transport:
      - Landauer 수송과 transmission: quantum-transport/landauer-transmission.md
      - Landauer 문서 검증 기록: quantum-transport/landauer-verification.md
